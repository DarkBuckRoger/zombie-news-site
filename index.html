<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Network | Breaking Update</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            scroll-behavior: smooth;
        }
        header {
            background-color: #8b0000;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #333;
            position: relative;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        /* Live Ticker Styling */
        .ticker-wrap {
            width: 100%;
            background-color: #222;
            color: #ff3333;
            padding: 8px 0;
            box-sizing: border-box;
            overflow: hidden;
            font-weight: bold;
            font-size: 0.95rem;
            border-bottom: 2px solid #8b0000;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker-move 25s linear infinite;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
        }
        @keyframes ticker-move {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        /* Flex Layout for Article and Sidebar Component */
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .content-left {
            flex: 3;
            min-width: 300px;
        }
        .sidebar-right {
            flex: 1;
            min-width: 280px;
        }
        .main-headline {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .main-headline h2 {
            color: #8b0000;
            margin-top: 0;
            font-size: 2rem;
        }
        .meta-info {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        /* Interactive Countdown Widget */
        .countdown-widget {
            background: #222;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            margin-bottom: 30px;
            text-align: center;
            border: 2px solid #ff3333;
        }
        .countdown-widget h3 {
            margin-top: 0;
            color: #ff3333;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer-display {
            font-size: 2rem;
            font-family: monospace;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            text-shadow: 0 0 5px #ff3333;
        }
        /* Interactive Fictional Visual Map Widget */
        .map-widget {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .map-widget h3 {
            margin-top: 0;
            color: #333;
            font-size: 1.1rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .map-canvas {
            width: 100%;
            height: 250px;
            background-color: #e0e4e6;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .map-bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#ccc 1px, transparent 1px), linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
        }
        .map-zone {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 0, 0, 0.2);
            border: 2px dashed #ff3333;
            transform: translate(-50%, -50%);
            animation: pulse-zone 2s infinite ease-in-out;
            cursor: pointer;
        }
        .zone-atlanta { top: 50%; left: 55%; width: 90px; height: 90px; }
        .map-pin {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .map-label {
            position: absolute;
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            transform: translate(-50%, -150%);
        }
        @keyframes pulse-zone {
            0% { background: rgba(255, 0, 0, 0.15); }
            50% { background: rgba(255, 0, 0, 0.35); }
            100% { background: rgba(255, 0, 0, 0.15); }
        }
        .map-controls {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }
        .map-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.8rem;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .map-btn:hover { background: #ddd; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #222;
        }
        .card-content p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .btn:hover {
            background: #a00000;
        }
        .story-section {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 30px;
            border-left: 5px solid #8b0000;
        }
        .story-section h2 {
            color: #333;
            margin-top: 0;
        }
        .comments-section {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 40px;
        }
        .comments-section h2 {
            color: #222;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .comment-form {
            margin-bottom: 30px;
        }
        .comment-form input, .comment-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .comment-form button {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .comment-form button:hover {
            background: #555;
        }
        .comment-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .comment-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-meta {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 5px;
        }
        .comment-author {
            font-weight: bold;
            color: #8b0000;
        }
        .comment-text {
            font-size: 0.95rem;
            color: #444;
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: #fff;
            margin-top: 40px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>GNN: Global News Network</h1>
    </header>

    <!-- Live Status Ticker Box -->
    <div class="ticker-wrap">
        <div class="ticker">
            <span class="ticker-item">⚠️ LIVE UPDATES: CDC places Atlanta testing facility under total biological isolation protocol...</span>
            <span class="ticker-item">⚠️ STOCK MARKET: Biotech shares plunge 12% following trial suspension announcements...</span>
